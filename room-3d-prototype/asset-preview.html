<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>转换资源预览</title>
<style>body{margin:0;background:#ddd9ce;color:#343a35;font:15px system-ui}header{position:absolute;z-index:2;top:18px;left:20px;right:20px;padding:16px;background:#fffdf3ed;border-radius:12px}h1{font-size:20px;margin:0 0 10px}select,button,a{font:inherit;margin-right:12px}select{max-width:52vw;padding:8px}p{margin:10px 0 0;font-size:13px}canvas{display:block}a{color:#405c4c}</style></head>
<body><header><h1>Unity 资源转换 · 完整资源库</h1>
<div class="filters"><select id="pack" aria-label="资源包"><option value="">全部资源包</option><option value="interior-1">Interior 1</option><option value="low-poly-rooms">30 Rooms</option><option value="goodies-cozy">Goodies Cozy</option></select><select id="category" aria-label="物件分类"><option value="">全部分类</option></select><input id="search" type="search" aria-label="搜索物件" placeholder="搜索：椅子、植物、chair…"><button id="clear">清空筛选</button></div>
<p id="count" role="status"></p><div class="selection"><button id="previous" aria-label="上一个模型">上一件</button><select id="asset" aria-label="选择模型"></select><button id="next" aria-label="下一个模型">下一件</button><button id="reset">复位视角</button><a href="/?level=2">返回小屋</a></div><p id="status" role="status">正在读取资源清单…</p><p>拖动旋转 · 滚轮缩放 · 仅加载选中的模型。分类与中文关键词按名称匹配；素材使用许可待核实。</p></header><script type="module" src="/asset-preview.js"></script></body></html>
