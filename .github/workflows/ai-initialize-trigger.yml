name: AI 初始化触发器

on:
  issues:
    types: [labeled]

permissions:
  id-token: write
  issues: write
  contents: write
  pull-requests: write

jobs:
  call-ai-initialize:
    if: >-
      github.event.issue != null &&
      github.event.label.name == 'ai-init' &&
      github.event.issue.state == 'open'
    uses: ndhy-ai-coding/ai-coding-workflows/.github/workflows/ai-initialize.yml@master
    with:
      issue_number: ${{ github.event.issue.number }}
      target_branch: ${{ github.event.repository.default_branch }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_PROXY_GATEWAY_URL: ${{ secrets.AI_PROXY_GATEWAY_URL }}
