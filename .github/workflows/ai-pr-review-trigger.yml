name: AI PR 评审触发器

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  id-token: write
  issues: write
  contents: write
  pull-requests: write
  actions: write

jobs:
  # 根据 PR head branch 判断调用哪个评审 workflow
  detect-stage:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.detect.outputs.stage }}
      pr_number: ${{ steps.detect.outputs.pr_number }}
    steps:
      - name: Detect stage from PR
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            let headRef;

            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              headRef = context.payload.pull_request.head.ref;
            } else if (context.eventName === 'issue_comment') {
              if (!context.payload.issue.pull_request) {
                core.setOutput('stage', '');
                core.setOutput('pr_number', '');
                return;
              }
              prNumber = context.payload.issue.number;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              headRef = pr.head.ref;
            }

            let stage = '';
            if (headRef.includes('requirement-analysis')) {
              stage = 'requirement-analysis';
            } else if (headRef.includes('tech-design')) {
              stage = 'tech-design';
            } else if (headRef.includes('tasks')) {
              stage = 'task-breakdown';
            } else if (headRef.includes('coding')) {
              stage = 'coding';
            }

            core.setOutput('stage', stage);
            core.setOutput('pr_number', prNumber.toString());

  call-requirement-review:
    needs: detect-stage
    if: needs.detect-stage.outputs.stage == 'requirement-analysis'
    uses: ndhy-ai-coding/ai-coding-workflows/.github/workflows/ai-review-requirement-analysis.yml@master
    with:
      repository: ${{ github.repository }}
      pr_number: ${{ fromJSON(needs.detect-stage.outputs.pr_number) }}
      event_name: ${{ github.event_name }}
      comment_body: ${{ github.event.comment.body || '' }}
      bot_name: ${{ vars.BOT_NAME }}
    secrets:
      CALLER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROXY_GATEWAY_URL: ${{ secrets.AI_PROXY_GATEWAY_URL }}
      CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

  call-tech-design-review:
    needs: detect-stage
    if: needs.detect-stage.outputs.stage == 'tech-design'
    uses: ndhy-ai-coding/ai-coding-workflows/.github/workflows/ai-review-tech-design.yml@master
    with:
      repository: ${{ github.repository }}
      pr_number: ${{ fromJSON(needs.detect-stage.outputs.pr_number) }}
      event_name: ${{ github.event_name }}
      comment_body: ${{ github.event.comment.body || '' }}
      bot_name: ${{ vars.BOT_NAME }}
    secrets:
      CALLER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROXY_GATEWAY_URL: ${{ secrets.AI_PROXY_GATEWAY_URL }}
      CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

  call-task-breakdown-review:
    needs: detect-stage
    if: needs.detect-stage.outputs.stage == 'task-breakdown'
    uses: ndhy-ai-coding/ai-coding-workflows/.github/workflows/ai-review-task-breakdown.yml@master
    with:
      repository: ${{ github.repository }}
      pr_number: ${{ fromJSON(needs.detect-stage.outputs.pr_number) }}
      event_name: ${{ github.event_name }}
      comment_body: ${{ github.event.comment.body || '' }}
      bot_name: ${{ vars.BOT_NAME }}
    secrets:
      CALLER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROXY_GATEWAY_URL: ${{ secrets.AI_PROXY_GATEWAY_URL }}
      CODEX_MODEL: ${{ secrets.CODEX_MODEL }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

  call-coding-review:
    needs: detect-stage
    if: needs.detect-stage.outputs.stage == 'coding'
    uses: ndhy-ai-coding/ai-coding-workflows/.github/workflows/ai-review-coding.yml@master
    with:
      repository: ${{ github.repository }}
      pr_number: ${{ fromJSON(needs.detect-stage.outputs.pr_number) }}
      event_name: ${{ github.event_name }}
      comment_body: ${{ github.event.comment.body || '' }}
      bot_name: ${{ vars.BOT_NAME }}
    secrets:
      CALLER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_PROXY_GATEWAY_URL: ${{ secrets.AI_PROXY_GATEWAY_URL }}
      CODEX_MODEL: ${{ secrets.CODEX_MODEL }}

      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

